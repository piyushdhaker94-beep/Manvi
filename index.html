<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Piyush</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* Surprise Box Styling */
        .surprise-box {
            width: 120px;
            height: 120px;
            background: #ffcc33;
            margin: 0 auto;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .surprise-box:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .surprise-box:active {
            transform: scale(0.9);
        }

        /* Image Modal */
        #image-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }

        #image-container img {
            max-width: 80%;
            max-height: 70%;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
            animation: popIn 0.5s ease;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aditya Chutiya Hai</h1>
        <p>Ek surprise hai tumhare liye...</p>
        
        <div class="surprise-box" onclick="showSurprise()">
            🎁
        </div>
    </div>

    <div id="image-container">
        <img src="ukk.jpg" alt="Surprise Image">
        <button class="close-btn" onclick="hideSurprise()">Close</button>
    </div>

    <script>
        function showSurprise() {
            document.getElementById('image-container').style.display = 'flex';
        }
        function hideSurprise() {
            document.getElementById('image-container').style.display = 'none';
        }
    </script>

</body>
</html>
